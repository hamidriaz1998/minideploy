app_name: sample-app
service_type: systemd
service_name: sample-app@%i

instances:
  - id: "3000"
    port: 3000
  - id: "3001"
    port: 3001

deploy_path: /opt/sample-app

build:
  - go build -o sample-app -ldflags="-X main.commit=$(git rev-parse --short HEAD)" .

artifacts:
  - sample-app

server:
  host: test-vm
  ssh_user: root
  # api_key: <from init-server output or global config>

keep_releases: 5

health_check:
  endpoint: /health
  timeout: 5
  retries: 3
  wait_between_instances: 2
